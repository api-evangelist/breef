  reason: no-developer-program
  detail: >-
    Breef ships only an end-user SaaS product: its 483-URL sitemap carries no developer,
    API, docs or integrations page, no api./developer./docs./app./mcp.breef.com hostname
    resolves at all, and no npm, PyPI, RubyGems, crates.io or Packagist package exists —
    the only machine-readable contract on the estate is the customer application's own
    Django REST Framework schema at projects.breef.com/api/schema/, which negotiates
    application/vnd.oai.openapi but answers anonymous callers with 403 "Authentication
    credentials were not provided", so it is an internal app backend rather than a
    published developer program.
