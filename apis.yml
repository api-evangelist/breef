aid: breef
name: Breef
description: 'Breef is an online agency marketplace and payments platform that connects
  brands with vetted marketing, creative, digital and web agencies. Founded in New York
  in 2019 as Curated and rebranded to Breef in 2021, the company is now headquartered in
  Denver. Brands scope a project on the platform, receive curated pitches from hand-picked
  agencies across 50+ project types in days rather than months, and then run contracts,
  milestones and payments through Breef — including Breef(Pay), its agency-now-pay-later
  payment product. The network spans roughly 25,000 vetted agencies across 27 countries.
  Breef is a hosted end-user SaaS product: it publishes no public developer program, API
  reference, SDK or webhook surface.'
